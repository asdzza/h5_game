name: Deploy to GitHub Pages

# ⚠️ 2026-11-07 起本仓库的 job 全部在"分配 runner"阶段失败，注解原文：
#    "The job was not started because your account is locked due to a billing issue."
#    账单解冻前这个工作流跑不起来。临时改用 `npm run deploy:pages`（推 gh-pages 分支），
#    并在 Settings → Pages 里把 Source 切到 "Deploy from a branch → gh-pages / (root)"。
#    账单恢复后可以把 Source 改回 "GitHub Actions"，本文件无需改动。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rules test
        run: node tools/test_rules.mjs

      - name: Stage static site
        run: |
          mkdir -p _site
          cp -r index.html styles.css src _site/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4